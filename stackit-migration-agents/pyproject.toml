[project]
name = "stackit-migration-agents"
version = "0.1.0"
description = "Multi-agent accelerator that migrates AWS (and later Azure) workloads to STACKIT."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.20",
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=3.0"]

[project.scripts]
migrate = "migrate.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrate", "src/mcp_servers"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "TID251"]
ignore = ["E501", "S603", "S607", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess.call".msg = "Use migrate.proc.run (argument lists, no shell)."
"os.system".msg = "Never shell out through a string; use migrate.proc.run."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "terraform: needs the terraform binary",
    "integration: needs local tools such as rclone or postgres",
]
